name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify application
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix mcp ci
          npm run lint
          npm run build
          npx tsx --test tests/*.test.ts
          npm --prefix functions run build

      - name: Deploy
        run: |
          RELEASE_NOTES_B64="$(git log -1 --pretty=%B | base64 | tr -d '\n')"
          gcloud run deploy ybcrm \
            --source . \
            --region europe-west1 \
            --project gen-lang-client-0565901030 \
            --min-instances 1 \
            --max-instances 3 \
            --concurrency 80 \
            --memory 1Gi \
            --cpu-throttling \
            --allow-unauthenticated \
            --update-env-vars NODE_ENV=production,WEBHOOK_URL=https://ybcrm.ru,SERVER_URL=https://ybcrm.ru,MCP_UPSTREAM_URL=https://ybcrm-mcp-wvb4x7sxeq-ew.a.run.app,ORDER_TELEGRAM_THREAD_ID=1244,RELEASE_TELEGRAM_THREAD_ID=12750,RELEASE_COMMIT_SHA=${GITHUB_SHA},RELEASE_NOTES_B64=${RELEASE_NOTES_B64} \
            --set-secrets TG_BOT_TOKEN=ybcrm-tg-bot-token:latest,GEMINI_API_KEY=ybcrm-gemini-api-key:latest,FAL_API_KEY=ybcrm-fal-api-key:latest,CONTENT_BOT_TOKEN=ybcrm-content-bot-token:latest,TG_API_HASH=ybcrm-tg-api-hash:latest,INSTAGRAM_WEBHOOK_VERIFY_TOKEN=ybcrm-instagram-webhook-verify-token:latest,AI_JOB_WORKER_SECRET=ybcrm-ai-job-worker-secret:latest \
            --quiet
