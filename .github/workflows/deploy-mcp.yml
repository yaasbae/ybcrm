name: Deploy MCP to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/deploy-mcp.yml"

jobs:
  deploy-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify MCP
        run: |
          npm --prefix mcp ci
          npm --prefix mcp run lint
          npm --prefix mcp test
          npm --prefix mcp run build

      - name: Deploy MCP
        env:
          FIREBASE_PROJECT_ID: gen-lang-client-0267383721
        run: |
          gcloud run deploy ybcrm-mcp \
            --source mcp \
            --region europe-west1 \
            --project gen-lang-client-0565901030 \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 3 \
            --update-env-vars NODE_ENV=production,FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_DATABASE_ID=production,CRM_BASE_URL=https://ybcrm.ru,MCP_PUBLIC_BASE_URL=https://ybcrm.ru,MCP_OAUTH_REDIRECT_URIS=https://chatgpt.com/connector_platform_oauth_redirect \
            --set-secrets CRM_JWT_SECRET=ybcrm-mcp-jwt-secret:latest,MCP_OAUTH_PIN=ybcrm-mcp-oauth-pin:latest \
            --quiet
